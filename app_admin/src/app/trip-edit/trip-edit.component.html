<h2>{{ id ? 'Edit Trip' : 'Add Trip' }}</h2>
<form [formGroup]="form" (ngSubmit)="save()" class="form">
  <label>Code <input formControlName="code"></label>
  <label>Name <input formControlName="name"></label>
  <label>Length (nights) <input type="number" formControlName="length"></label>
  <label>Start <input type="date" formControlName="start"></label>
  <label>Resort <input formControlName="resort"></label>
  <label>Per Person <input type="number" formControlName="perPerson" step="1"></label>
  <label>Image file <input formControlName="image" placeholder="reef1.jpg"></label>
  <label>Description <textarea formControlName="description"></textarea></label>
  <div class="buttons">
    <button type="submit">Save</button>
    <a routerLink="/trips">Cancel</a>
  </div>
</form>
<style>
.form{display:grid;gap:12px;max-width:480px;margin-top:12px}
.form label{display:grid;gap:6px}
.form input,.form textarea{padding:8px;border:1px solid #ddd;border-radius:6px}
.buttons{display:flex;gap:8px}
button{padding:8px 12px;border:1px solid #0b5ed7;border-radius:6px;background:#0b5ed7;color:#fff}
a{padding:8px 12px;border:1px solid #6c757d;border-radius:6px;text-decoration:none;color:#6c757d}
</style>
