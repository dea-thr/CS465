<form [formGroup]="form" (ngSubmit)="save()" class="vstack gap-3">
  <div>
    <label class="form-label">Code</label>
    <input class="form-control" formControlName="code" placeholder="e.g., SH004" />
  </div>

  <div>
    <label class="form-label">Name</label>
    <input class="form-control" formControlName="name" placeholder="Trip name" />
  </div>

  <div>
    <label class="form-label">Length</label>
    <input class="form-control" formControlName="length" placeholder="e.g., 6 nights" />
  </div>

  <div>
    <label class="form-label">Start</label>
    <input class="form-control" type="date" formControlName="start" />
  </div>

  <div>
    <label class="form-label">Resort</label>
    <input class="form-control" formControlName="resort" placeholder="Resort name" />
  </div>

  <div>
    <label class="form-label">Per Person</label>
    <input class="form-control" formControlName="perPerson" placeholder="$1,999" />
  </div>

  <div>
    <label class="form-label">Image URL</label>
    <input class="form-control" formControlName="image" placeholder="/images/reef1.jpg" />
  </div>

  <div>
    <label class="form-label">Description</label>
    <textarea class="form-control" rows="4" formControlName="description"></textarea>
  </div>

  <div class="d-flex gap-2">
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-outline-secondary" routerLink="/trips">Cancel</a>
  </div>
</form>
